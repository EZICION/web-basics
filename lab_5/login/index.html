        <section class="form">
            <h1 id="form_title">Аутентификация</h1>
            <form action="https://httpbin.org/post" method="post" id="auth">
                <p>
                    <label for="login">Логин</label>
                    <input type="text" name="login" id="login" class="text_form" required>
                </p>
                <p>
                    <label for="password">Пароль</label>
                    <input type="password" name="password" id="password" class="text_form" required>
                </p>
                <p>
                    <label for="remember" class="ots_bot">
                        <input type="checkbox" name="remember" id="remember"><span> Запомнить меня</span>
                    </label>
                </p>
            </form>
            <div id="but"><button name="submit" form="auth" id="submit">Войти</button></div>
        </section>
    </main>
    <footer id="end">
            <p id="call_us">Позвонить нам </p>
            <a href="">+7-000-000-00-00</a>
